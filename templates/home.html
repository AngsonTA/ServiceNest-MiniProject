{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
/* Modern Home Page Styles */
.home-page {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    min-height: 100vh;
}

/* Modern Carousel Styles */
.modern-carousel {
    position: relative;
    overflow: hidden;
    border-radius: 0 0 30px 30px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

.carousel-item {
    position: relative;
    overflow: hidden;
}

.carousel-item img {
    width: 100%;
    height: 60vh;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.carousel-item:hover img {
    transform: scale(1.05);
}

.modern-carousel-control {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6366f1;
    font-size: 1.5rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    z-index: 5;
}

.modern-carousel-control:hover {
    background: #6366f1;
    color: white;
    transform: translateY(-50%) scale(1.1);
    text-decoration: none;
}

.carousel-control-prev {
    left: 30px;
}

.carousel-control-next {
    right: 30px;
}

/* Products Section */
.products-section {
    padding: 4rem 0;
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
}

.section-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1rem;
}

.modern-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 2px solid #e2e8f0;
    position: relative;
}

.modern-section-header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100px;
    height: 2px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    border-radius: 2px;
}

.section-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #1f2937;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.section-icon {
    font-size: 2rem;
    color: #6366f1;
}

.see-all-btn {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: white;
    border: none;
    padding: 1rem 2rem;
    border-radius: 50px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.see-all-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
    color: white;
    text-decoration: none;
}

/* Keep original Bootstrap grid but enhance styling */
.card-product-grid {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    margin-bottom: 2rem;
}

.card-product-grid:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
}

.card-product-grid .img-wrap {
    position: relative;
    overflow: hidden;
    height: 250px;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    display: block;
}

.card-product-grid .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.card-product-grid:hover .img-wrap img {
    transform: scale(1.1);
}

.card-product-grid .info-wrap {
    padding: 2rem;
}

.card-product-grid .title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 1rem;
    line-height: 1.3;
    text-decoration: none;
    display: block;
    transition: color 0.3s ease;
}

.card-product-grid .title:hover {
    color: #6366f1;
    text-decoration: none;
}

.card-product-grid .price {
    font-size: 1.5rem;
    font-weight: 800;
    color: #059669;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.card-product-grid .rating-star {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.card-product-grid .rating-star span {
    display: flex;
    gap: 0.25rem;
}

.card-product-grid .rating-star i {
    color: #f59e0b;
    font-size: 1rem;
}

.product-badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    z-index: 2;
}

/* Responsive Design */
@media (max-width: 992px) {
    .modern-section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }
    
    .section-title {
        font-size: 2rem;
    }
}

@media (max-width: 768px) {
    .carousel-item img {
        height: 40vh;
    }
    
    .modern-carousel-control {
        width: 50px;
        height: 50px;
        font-size: 1.25rem;
    }
    
    .carousel-control-prev {
        left: 15px;
    }
    
    .carousel-control-next {
        right: 15px;
    }
    
    .products-section {
        padding: 3rem 0;
    }
    
    .section-title {
        font-size: 1.75rem;
    }
    
    .card-product-grid .info-wrap {
        padding: 1.5rem;
    }
}

@media (max-width: 576px) {
    .carousel-item img {
        height: 30vh;
    }
    
    .section-container {
        padding: 0 0.5rem;
    }
    
    .modern-section-header {
        margin-bottom: 2rem;
    }
    
    .section-title {
        font-size: 1.5rem;
    }
    
    .see-all-btn {
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
    }
    
    .card-product-grid .img-wrap {
        height: 200px;
    }
}
</style>

<div class="home-page">
    <!-- Modern Carousel Section -->
    <section class="modern-carousel">
        <div class="container-fluid p-0">
            <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="d-block w-100" src="{% static 'images/banners/detergent.jpg' %}" alt="First slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="{% static 'images/banners/1.jpg' %}" alt="Second slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="{% static 'images/banners/2.jpg' %}" alt="Third slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="{% static 'images/banners/veg.jpg' %}" alt="Third slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="{% static 'images/banners/waterheaters.jpg' %}" alt="Third slide">
                    </div>
                </div>
                <a class="modern-carousel-control carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
                    <i class="fas fa-chevron-left"></i>
                    <span class="sr-only">Previous</span>
                </a>
                <a class="modern-carousel-control carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
                    <i class="fas fa-chevron-right"></i>
                    <span class="sr-only">Next</span>
                </a>
            </div>
        </div>
    </section>

    <!-- Popular Services Section -->
    <section class="products-section">
        <div class="section-container">
            <header class="modern-section-header">
                <div>
                    <h3 class="section-title">
                        <i class="fas fa-fire section-icon"></i>
                        Popular Services
                    </h3>
                </div>
                <a href="{% url 'store' %}" class="see-all-btn">
                    <i class="fas fa-arrow-right"></i>
                    See All
                </a>
            </header>

            <div class="row">
                {% for product in products %}
                <div class="col-md-3">
                    <div class="card card-product-grid">
                        <div class="product-badge">Popular</div>
                        <a href="{{ product.get_url }}" class="img-wrap">
                            <img src="{{ product.images.url }}" alt="{{ product.product_name }}">
                        </a>
                        <figcaption class="info-wrap">
                            <a href="{{ product.get_url }}" class="title">{{ product.product_name }}</a>
                            <div class="price mt-1">RS {{ product.price }}</div>
                            <div class="rating-star">
                                <span>
                                    <i class="fa fa-star{% if product.averageReview < 0.5 %}-o{% elif product.averageReview >= 0.5 and product.averageReview < 1 %}-half-o {% endif %}" aria-hidden="true"></i>
                                    <i class="fa fa-star{% if product.averageReview < 1.5 %}-o{% elif product.averageReview >= 1.5 and product.averageReview < 2 %}-half-o {% endif %}" aria-hidden="true"></i>
                                    <i class="fa fa-star{% if product.averageReview < 2.5 %}-o{% elif product.averageReview >= 2.5 and product.averageReview < 3 %}-half-o {% endif %}" aria-hidden="true"></i>
                                    <i class="fa fa-star{% if product.averageReview < 3.5 %}-o{% elif product.averageReview >= 3.5 and product.averageReview < 4 %}-half-o {% endif %}" aria-hidden="true"></i>
                                    <i class="fa fa-star{% if product.averageReview < 4.5 %}-o{% elif product.averageReview >= 4.5 and product.averageReview < 5 %}-half-o {% endif %}" aria-hidden="true"></i>
                                </span>
                            </div>
                        </figcaption>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
</div>

{% endblock %}
